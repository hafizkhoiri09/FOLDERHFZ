<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momen Terindah</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="balloon-layer" aria-hidden="true">
      <span class="balloon balloon-pink" style="--x: 8%; --delay: 0s; --size: 72px;"></span>
      <span class="balloon balloon-yellow" style="--x: 18%; --delay: 1.5s; --size: 86px;"></span>
      <span class="balloon balloon-red" style="--x: 32%; --delay: 0.8s; --size: 64px;"></span>
      <span class="balloon balloon-purple" style="--x: 48%; --delay: 2.2s; --size: 78px;"></span>
      <span class="balloon balloon-cyan" style="--x: 62%; --delay: 1.1s; --size: 70px;"></span>
      <span class="balloon balloon-pink" style="--x: 76%; --delay: 2.6s; --size: 88px;"></span>
      <span class="balloon balloon-yellow" style="--x: 90%; --delay: 0.4s; --size: 74px;"></span>
    </div>

    <div class="page moment-page">
      <div class="hero soft-glow">
        <div class="hero-inner">
          <div class="name-anim">momen terindah</div>
          <p class="intro">Sebuah potongan waktu yang penuh cinta, tawa, dan kenangan indah. Biarkan video ini membawa kita kembali ke momen spesial.</p>

          <div class="video-card audio-card">
            <div class="video-label">momen spesial</div>
            <video id="momentVideo" autoplay muted playsinline preload="auto" controls>
              <source src="WhatsApp Video 2026-08-07 at 02.31.25.mp4"
              Browser kamu tidak mendukung pemutar video.
            </video>
            <div class="video-caption">happy birthday sayanggkuu mwahhh.</div>
          </div>
        </div>
      </div>
    </div>

    <script src="moment.js"></script>
  </body>
</html>
